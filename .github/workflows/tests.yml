name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightweight-tests:
    name: Lightweight tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt -e .

      # Expensive preparation, MD, GBSA, ProLIF, and full-analysis tests are
      # opt-in via --run-* flags and are intentionally not enabled here.
      - name: Run lightweight tests
        run: >-
          python -m pytest streamd/tests -q
          --cov
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Store coverage report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Upload coverage to Codecov
    if: github.event_name == 'push'
    needs: lightweight-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository metadata
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@v7
        with:
          name: coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.xml
          flags: unittests
          name: lightweight-tests
          fail_ci_if_error: true
