name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightweight-tests:
    name: Lightweight tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt -e .

      # Expensive preparation, MD, GBSA, ProLIF, and full-analysis tests are
      # opt-in via --run-* flags and are intentionally not enabled here.
      - name: Run lightweight tests
        run: python -m pytest streamd/tests -q
